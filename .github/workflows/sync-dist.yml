# Собирает публичную копию скрипта (без апдейтера и URL GitHub)
# и пушит её в ветку dist — оттуда Greasy Fork забирает обновления по вебхуку.
name: Sync public build to dist

on:
  push:
    branches: [master]
    paths:
      - duo-helper.user.js
      - tools/prepare-gf.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build public copy
        run: node tools/prepare-gf.mjs

      - name: Publish to dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp gf/duo-helper.public.user.js "$work/"
          cd "$work"
          git init -q
          git symbolic-ref HEAD refs/heads/dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes in the public build — nothing to publish."
            exit 0
          fi
          git commit -q -m "Build public copy from ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
          git push -f origin dist
